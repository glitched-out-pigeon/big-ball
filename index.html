<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deep Space Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deepspace: '#020617', // slate-950
            neon: {
              cyan: '#06b6d4', // cyan-500
              green: '#10b981', // emerald-500
            }
          },
          fontFamily: {
            mono: ['"Courier New"', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-deepspace text-neon-cyan font-mono overflow-hidden select-none">
  
  <div id="canvas-container" class="absolute inset-0 z-0"></div>
  
  <div id="ui-overlay" class="absolute inset-0 z-10 pointer-events-none p-6 flex flex-col justify-between">
    <header class="flex justify-between items-start">
      <div>
        <h1 class="text-2xl font-bold tracking-widest text-neon-cyan uppercase drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]">Deep Space Explorer</h1>
        <p class="text-xs mt-1 text-neon-green/80">Terminal v2.4.9 | Status: <span class="text-neon-cyan animate-pulse">ONLINE</span></p>
      </div>
      <div class="text-right border border-neon-cyan/30 p-2 bg-black/40 backdrop-blur-sm rounded">
        <p class="text-xs mb-1">SYSTEM COORDS</p>
        <p class="text-sm">X: 84.22.9 | Y: 11.002.4</p>
      </div>
    </header>

    <div class="flex-grow flex justify-between items-center w-full px-8">
      <!-- Topography Legend -->
      <div id="legend-panel" class="border flex flex-col gap-2 border-neon-cyan/50 bg-black/40 backdrop-blur pointer-events-auto p-4 rounded-lg shadow-[0_0_10px_rgba(6,182,212,0.2)]">
        <h2 class="text-xs border-b border-neon-cyan/30 pb-1 mb-1 tracking-widest text-neon-cyan/80 uppercase">Topography Legend</h2>
        <div class="flex items-center gap-2 text-xs"><div class="w-3 h-3 bg-[#e6331a]"></div>Highlands (Peaks)</div>
        <div class="flex items-center gap-2 text-xs"><div class="w-3 h-3 bg-[#cc9900]"></div>Midlands</div>
        <div class="flex items-center gap-2 text-xs"><div class="w-3 h-3 bg-[#1a9933]"></div>Lowlands</div>
        <div class="flex items-center gap-2 text-xs"><div class="w-3 h-3 bg-[#0080cc]"></div>Shallows</div>
        <div class="flex items-center gap-2 text-xs"><div class="w-3 h-3 bg-[#000099]"></div>Deep Ocean</div>
        <div class="flex items-center gap-2 text-xs"><div class="w-3 h-3 bg-[#4d0080]"></div>Abyss</div>
      </div>
      
      <!-- Data Display Panel -->
      <div id="data-panel" class="border flex flex-col gap-3 border-neon-cyan bg-black/50 backdrop-blur pointer-events-auto p-4 rounded-lg w-64 shadow-[0_0_15px_rgba(6,182,212,0.3)] opacity-0 transition-opacity duration-500">
        <h2 class="text-sm border-b border-neon-cyan/50 pb-1 mb-2 tracking-widest text-neon-green">PLANET DATA</h2>
        
        <div class="flex justify-between items-center relative">
          <span class="text-xs opacity-70">O2 LEVELS</span>
          <span id="data-o2" class="text-sm font-bold">---</span>
          <div class="absolute -bottom-1 left-0 h-[1px] bg-neon-cyan/20 w-full"><div id="bar-o2" class="h-full bg-neon-cyan w-0 transition-all duration-1000"></div></div>
        </div>

        <div class="flex justify-between items-center relative mt-1">
          <span class="text-xs opacity-70">SURFACE TEMP</span>
          <span id="data-temp" class="text-sm font-bold">---</span>
          <div class="absolute -bottom-1 left-0 h-[1px] bg-neon-cyan/20 w-full"><div id="bar-temp" class="h-full bg-neon-green w-0 transition-all duration-1000"></div></div>
        </div>

        <div class="flex justify-between items-center relative mt-1">
          <span class="text-xs opacity-70">GRAVITY</span>
          <span id="data-grav" class="text-sm font-bold">---</span>
          <div class="absolute -bottom-1 left-0 h-[1px] bg-neon-cyan/20 w-full"><div id="bar-grav" class="h-full bg-neon-cyan w-0 transition-all duration-1000"></div></div>
        </div>

        <div id="scan-status" class="mt-4 text-xs text-center text-neon-green animate-pulse hidden">SCANNING...</div>
      </div>
    </div>

    <footer class="flex justify-center pb-8">
      <button id="scan-btn" class="pointer-events-auto border-2 border-neon-cyan text-neon-cyan bg-black/60 px-8 py-3 rounded uppercase tracking-widest font-bold hover:bg-neon-cyan/20 hover:shadow-[0_0_20px_rgba(6,182,212,0.6)] focus:outline-none transition-all active:scale-95">
        Atmosphere Scanner
      </button>
    </footer>
  </div>

  <!-- Import maps polyfill -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
